name: "local-instabox-keepalive"
title: "InstaBox 保活"
description: "用零 token 纯脚本保活 InstaBox 机器：每 10 分钟 exec 防闲置休眠，7h50m 主动 suspend→resume 重置 8 小时计时、机内看门狗检查服务，被强制暂停则冷却结束后精准唤醒，多账号全量巡检，agent 只在脚本失败时被叫醒。首次部署带向导：一步步问账号、教用户生成 API Key 并自己存进 Vault、验证后自动部署。"
category: "Work and knowledge"
include_in_prompt: true
